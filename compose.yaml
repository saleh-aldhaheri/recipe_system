version: '3.9'

services:
  php-app:
    build: .
    container_name: Recipe_Management
    env_file:
      - .env
    volumes:
      - .:/www/var 
      - ./vendor:/www/var/vendor
    networks:
      - app-network
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "8080:80"
    volumes:
      - ./public:/app/public
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - app-network
    depends_on:
      - php-app

  db:
    image: mysql:8.0
    container_name: db
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: FOOD_PRODUCT
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - db-data:/var/lib/mysql
    networks:
      - app-network

  redis:
    image: redis:7
    container_name: redis
    networks:
      - app-network

networks:
  app-network:

volumes:
  db-data:
