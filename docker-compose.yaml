version: '3.9'

services:

  php-app:
    build:  
      context: .  
      dockerfile: Dockerfile
    image: alehaldhaheri1010/recipe:latest
    container_name: Recipe_Management_pro
    environment:
      - APP_ENV=prod
    env_file:
      - .env.prod
    networks:
      - app-network
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:latest
    container_name: nginx_pro
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.prod.conf:/etc/nginx/conf.d/default.conf
      - ./public:/var/www/html/public:ro
    networks:
      - app-network
    depends_on:
      - php-app

  db:
    image: mysql:8.0
    container_name: db_pro
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: FOOD_PRODUCT
    command: --max_connections=200 --wait_timeout=600 --interactive_timeout=600 --bind-address=0.0.0.0
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - db-data:/var/lib/mysql
    networks:
      - app-network

  redis:
    image: redis:7
    container_name: redis_pro
    networks:
      - app-network

networks:
  app-network:

volumes:
  db-data:
