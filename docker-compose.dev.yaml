version: '3.9'

services:
  php-app_dev:
    build: .
    container_name: Recipe_Management_dev
    environment:
      - APP_ENV=dev
    env_file:
      - .env.dev
    volumes:
      - .:/www/var 
      - ./vendor:/www/var/vendor
      - ./docker/php-fpm-www.conf:/usr/local/etc/php-fpm.d/www.conf
    networks:
      - app-network_dev
    depends_on:
      - db_dev
      - redis_dev

  nginx_dev:
    image: nginx:latest
    container_name: nginx_dev
    ports:
      - "8081:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./nginx/default.dev.conf:/etc/nginx/conf.d/default.conf
    networks:
      - app-network_dev
    depends_on:
      - php-app_dev

  db_dev:
    image: mysql:8.0
    container_name: db_dev
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: FOOD_PRODUCT_DEV
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - db-data-dev:/var/lib/mysql
    networks:
      - app-network_dev

  redis_dev:
    image: redis:7
    container_name: redis_dev
    networks:
      - app-network_dev

networks:
  app-network_dev:

volumes:
  db-data-dev:
